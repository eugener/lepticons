name: Preview

on:
  push:
    branches:
      - develop
    paths:
      - 'lepticons/**'
      - 'lepticons-picker/**'
      - 'lepticons-animate/**'
      - 'demo/**'
      - 'Cargo.*'
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: "0.21.14"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-preview-deploy:
    runs-on: ubuntu-latest
    name: Build and Preview Deploy
    permissions:
      pull-requests: write
      contents: read
      deployments: write
    env:
      # Dependabot and fork PRs run without access to repo secrets, so the
      # deploy steps below are skipped there. The release build still runs.
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - name: git-checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar xzf - -C /usr/local/bin
      - name: Build
        working-directory: demo
        run: trunk build --release

      - name: Install Vercel CLI
        if: env.HAS_VERCEL_TOKEN == 'true'
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        if: env.HAS_VERCEL_TOKEN == 'true'
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token="$TOKEN"
      - name: Preview Deploy
        if: env.HAS_VERCEL_TOKEN == 'true'
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: demo/dist
        run: vercel deploy --token="$TOKEN"
